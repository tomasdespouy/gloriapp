name: Supabase - Push migrations

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ndwmnxlwbfqfwwtekjun

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # El auth API de Supabase devuelve intermitentemente "OOM ... maxmemory"
      # (Redis saturado de su lado) → el link falla al azar. Reintentamos.
      - name: Link project (con reintentos)
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if supabase link --project-ref "$SUPABASE_PROJECT_ID"; then ok=1; break; fi
            echo "link: intento $i falló (probable OOM transitorio de Supabase); reintento en 20s..."
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "link falló tras 6 intentos"; exit 1; }

      # Los runners de GitHub NO tienen IPv6, y la conexión DIRECTA a la base
      # (db.<ref>.supabase.co) es IPv6-only → migration list / db push fallaban
      # con "IPv6 is not supported on your current network". Forzamos la conexión
      # por el SESSION POOLER (IPv4, puerto 5432, apto para DDL/migraciones) vía
      # --db-url. La password (ya secreta) se URL-encodea. Región: us-west-2.
      - name: Push migrations (session pooler / IPv4)
        run: |
          ENC_PW=$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENC_PW}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
          echo "Pendientes:"
          supabase migration list --db-url "$DB_URL"
          supabase db push --include-all --db-url "$DB_URL"
          echo "Estado final:"
          supabase migration list --db-url "$DB_URL"
